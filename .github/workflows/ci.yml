name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared minimum (requires-python); 3.13 is current.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        env:
          HYPOTHESIS_PROFILE: ci
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          liqbracket solve examples/long_near_boundary.json --mode both
          liqbracket divergence examples/long_near_boundary.json --from 0.36 --to 0.44 --steps 8
      - name: Benchmark smoke test
        run: python benchmarks/accuracy.py --accounts 5000 --seed 1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Install pinned ruff
        run: python -m pip install "ruff==0.6.9"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
